# Link to the existing App in Dev Dashboard before running dev.
client_id = ""
name = "Configurator Dashboard"
application_url = "https://example.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[access_scopes]
# Customer tags authorize the private catalog; app proxy serves the storefront.
scopes = "read_customers,write_app_proxy"

[auth]
redirect_urls = ["https://example.com/auth/callback"]

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/webhooks/app/uninstalled"

[[webhooks.subscriptions]]
topics = ["app/scopes_update"]
uri = "/webhooks/app/scopes_update"

[app_proxy]
url = "https://example.com/proxy"
subpath = "umx-configurator"
prefix = "apps"
